<title>Connexion - À dispo</title>
<!--
  LA PAGE DE CONNEXION.
  Devis N°2, NON SIGNE : « Création de compte, connexion, mot de passe oublié ».
  Construite parce que les quatre modules d'agenda, eux, SONT payes au devis
  N°1 et ne peuvent pas exister sans comptes.

  DEUX CHEMINS, ET PAS TROIS. Google, parce que la majorite des artisans ont
  une adresse Gmail et que c'est un clic. L'adresse mail avec mot de passe,
  parce que beaucoup ont une adresse d'entreprise chez OVH ou Orange et que
  leur imposer Google serait leur fermer la porte. Rien d'autre : chaque
  fournisseur ajoute est une piece a maintenir et un ecran de plus a lire.

  UN SEUL FORMULAIRE POUR S'INSCRIRE ET SE CONNECTER. Deux onglets « connexion »
  et « inscription » font hesiter : l'artisan ne sait pas s'il a deja un compte,
  il y a six mois qu'il a vu le QR code. On demande l'adresse, et c'est la
  REPONSE DE LA BASE qui dit s'il faut creer ou entrer. Il ne choisit rien.

  CE QUE LA PAGE NE FAIT PAS. Elle ne cree pas la fiche : c'est la fonction
  `ma_fiche()` qui s'en charge cote base, au premier passage, et qui gere le
  cas de deux onglets ouverts en meme temps. Une creation cote navigateur
  aurait produit des doublons le jour ou quelqu'un double-clique.

  LE MOT DE PASSE N'EST JAMAIS LU ICI. Il part directement a Supabase, qui le
  hache. Aucun champ, aucun journal, aucune mesure ne le touche.
-->

<script type="module">
/* La base du projet. La cle publique est publique par nature : la protection
   vient des autorisations posees sur les tables, pas du secret de la cle.
   Verifie le 13/09/2026 : une lecture de `contacts` avec cette cle, sans
   session, rend une liste VIDE. */
const BASE = "https://ucnyvsocoxenxbuakluo.supabase.co";
const CLE  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjbnl2c29jb3hlbnhidWFrbHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjIyMDAsImV4cCI6MjEwMzk5ODIwMH0.IHTUOXDj69OdIbLOmxXk7dTBiUIZJHoshPaVGd6O3JY";

/* Apres connexion, on part vers l'accompagnement. C'est lui qui decide quoi
   montrer selon l'etape deja atteinte : l'artisan qui revient ne recommence
   pas, il continue. */
const APRES = "/espace";

const $ = (id) => document.getElementById(id);
const R_EMAIL = /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i;

function dire(quel, titre, corps) {
  for (const k of ["ok", "ko"]) $("s-" + k).classList.remove("vu");
  const d = $("s-" + quel);
  d.innerHTML = "<b>" + titre + "</b> " + (corps || "");
  d.classList.add("vu");
}

/* --------- Supabase, charge seulement quand il sert ---------
   Le module pese quelques dizaines de kilo-octets. Le charger au clic plutot
   qu'au chargement evite de le faire descendre a quelqu'un qui ne fait que
   passer, souvent en 4G sur un chantier. */
let client = null;
async function supabase() {
  if (client) return client;
  const { createClient } = await import(
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  client = createClient(BASE, CLE, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  return client;
}

/* --------- Google ---------

   POURQUOI ON DEMANDE AVANT DE CLIQUER. `signInWithOAuth` fait NAVIGUER le
   navigateur vers Supabase. Si le fournisseur n'y est pas active, Supabase
   repond un objet JSON brut, et l'artisan atterrit sur une page blanche
   couverte de code :
     {"code":400,"error_code":"validation_failed",
      "msg":"Unsupported provider: provider is not enabled"}
   Le try/catch ci-dessous ne peut RIEN y faire : la page est deja partie quand
   l'erreur arrive. Mesure du 14/09/2026 sur ce projet : seul `email` est actif,
   `google` vaut false. Un bouton qui promet et qui tombe la-dessus est un
   bouton mort, et la regle du projet est qu'on le DIT plutot qu'on le cache.

   Le point /auth/v1/settings est public et se lit avec la cle publique : il
   rend la liste des fournisseurs actifs. On le consulte au chargement, une
   seule fois, et le bouton dit la verite avant d'etre touche. */

let googleActif = null;

async function fournisseurGoogleActif() {
  if (googleActif !== null) return googleActif;
  const r = await fetch(BASE + "/auth/v1/settings", { headers: { apikey: CLE } });
  if (!r.ok) throw new Error("reglages illisibles");
  const d = await r.json();
  googleActif = !!(d && d.external && d.external.google);
  return googleActif;
}

/* Au chargement : si le fournisseur n'est pas la, le bouton s'eteint et dit
   pourquoi, exactement comme les agendas non raccordes dans /espace. Si le
   reglage est illisible (reseau coupe, service en panne), on ne touche a rien :
   on ne punit pas l'artisan pour une panne qui n'est pas la sienne, et le
   controle au clic ci-dessous reste en place. */
(async () => {
  try {
    if (await fournisseurGoogleActif()) return;
    const b = $("google"), n = $("note-google");
    b.disabled = true;
    b.setAttribute("aria-describedby", "note-google");
    n.textContent = "Pas encore raccordé : la connexion Google demande des "
      + "identifiants à créer chez Google. En attendant, entre ton adresse mail "
      + "juste en dessous, ça marche aussi bien.";
    n.hidden = false;
  } catch (e) { /* reglages illisibles : on laisse le bouton tel quel */ }
})();

$("google").addEventListener("click", async () => {
  const b = $("google");
  b.disabled = true;
  try {
    /* Deuxieme garde, pour le cas ou le chargement n'a pas pu conclure. */
    if (!(await fournisseurGoogleActif())) {
      throw new Error("La connexion Google n'est pas encore raccordée.");
    }
    const sb = await supabase();
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + APRES }
    });
    if (error) throw error;
  } catch (e) {
    b.disabled = false;
    dire("ko", "La connexion Google n'est pas encore disponible.",
      "Entre ton adresse mail juste en dessous, ça marche aussi bien." +
      (e && e.message ? " <br><small>" + e.message + "</small>" : ""));
  }
});

/* --------- Adresse mail ---------
   `mode` vaut null tant qu'on ne sait pas, puis 'entrer' ou 'creer'. C'est la
   BASE qui tranche, jamais l'artisan. */
let mode = null;

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = $("email").value.trim();
  const mdp = $("mdp").value;

  if (!R_EMAIL.test(email)) {
    $("email").setAttribute("aria-invalid", "true");
    dire("ko", "Vérifie ton adresse.", "Il manque quelque chose.");
    return;
  }
  $("email").setAttribute("aria-invalid", "false");

  const b = $("valider");
  /* L'ETAT DE CHARGEMENT. Sans lui, le bouton restait ecrit « Continuer »
     pendant tout l'aller-retour avec la base : desactive, donc muet. Le
     libelle d'origine est relu ici et non recopie, pour qu'il suive le texte
     du bouton le jour ou il change. */
  const etiquette = b.textContent;
  const rendre = () => { b.disabled = false; b.textContent = etiquette; };

  /* PREMIER TEMPS, ET IL NE CHARGE RIEN. Reveler le champ du mot de passe ne
     demande aucune bibliotheque : le faire apres `await supabase()` rendait le
     formulaire muet tant que le module n'etait pas descendu, ce qui sur un
     chantier en 4G se compte en secondes. Il repond maintenant instantanement.

     On ne cherche PAS a savoir si le compte existe avant de demander le mot de
     passe. Supabase repond « identifiants invalides » dans les deux cas, compte
     existant ou non, et c'est voulu de leur part : repondre differemment
     permettrait de savoir quelles adresses sont inscrites. On demande donc le
     mot de passe en proposant les deux issues. */
  if (mode === null) {
    mode = "inconnu";
    $("c-mdp").classList.remove("cache");
    $("mdp").focus();
    $("l-mdp").textContent = "Ton mot de passe";
    $("aide-mdp").innerHTML =
      "Première visite&nbsp;? Choisis-en un, il sera créé. " +
      "Huit caractères minimum. " +
      "<button type='button' class='lien' id='oubli'>Mot de passe oublié</button>";
    $("lead").textContent = "Entre ton mot de passe. Si tu n'as pas encore de compte, il sera créé.";
    $("oubli").addEventListener("click", oublie);
    return;
  }

  b.disabled = true;
  b.textContent = "Un instant…";
  try {
    const sb = await supabase();

    if (!mdp || mdp.length < 8) {
      $("mdp").setAttribute("aria-invalid", "true");
      dire("ko", "Huit caractères minimum.", "C'est la seule exigence.");
      rendre();
      return;
    }
    $("mdp").setAttribute("aria-invalid", "false");

    /* SECOND TEMPS : on tente d'entrer. Si la base refuse, on tente de creer.
       L'ordre compte : tenter la creation d'abord renverrait « adresse deja
       prise » a quelqu'un qui a simplement mal tape son mot de passe. */
    const { error: e1 } = await sb.auth.signInWithPassword({ email, password: mdp });
    if (!e1) { location.assign(APRES); return; }

    const { data, error: e2 } = await sb.auth.signUp({
      email, password: mdp,
      options: { emailRedirectTo: location.origin + APRES }
    });

    if (e2) {
      /* Cas mesure le 13/09/2026 : le projet Supabase avait les inscriptions
         FERMEES, et l'artisan recevait « verifie ton mot de passe » alors que
         son mot de passe n'y etait pour rien. Un message faux fait chercher au
         mauvais endroit. */
      if (/signup.*disabled|not allowed/i.test(e2.message || "") ||
          e2.code === "signup_disabled") {
        dire("ko", "Les inscriptions ne sont pas encore ouvertes.",
          "Reviens bientôt. Si tu as déjà un compte, vérifie ton mot de passe.");
        rendre();
        return;
      }
      /* Le compte existe et le mot de passe ne va pas. On ne dit pas « ce
         compte existe » : ce serait confirmer qu'une adresse est inscrite a
         qui essaie au hasard. */
      dire("ko", "Ça ne passe pas.",
        "Vérifie ton mot de passe, ou demande à le réinitialiser.");
      rendre();
      return;
    }

    /* Supabase peut demander une confirmation par mail avant d'ouvrir la
       session. Dans ce cas il n'y a pas de session, et on le dit. */
    if (data && data.session) { location.assign(APRES); return; }
    dire("ok", "Compte créé.",
      "On vient de t'envoyer un mail. Clique sur le lien qu'il contient pour " +
      "activer ton espace. Rien reçu dans deux minutes ? Regarde dans les indésirables.");
    rendre();

  } catch (e) {
    dire("ko", "Ça n'a pas marché.",
      "Réessaie dans un instant." + (e && e.message ? " <br><small>" + e.message + "</small>" : ""));
    rendre();
  }
});

async function oublie() {
  const email = $("email").value.trim();
  if (!R_EMAIL.test(email)) { dire("ko", "Entre d'abord ton adresse.", ""); return; }
  try {
    const sb = await supabase();
    await sb.auth.resetPasswordForEmail(email,
      { redirectTo: location.origin + "/connexion?reinit=1" });
  } catch (e) { /* on ne dit rien de plus : voir ci-dessous */ }
  /* On repond PAREIL que l'adresse existe ou non. Dire « adresse inconnue »
     permettrait de savoir qui est inscrit. */
  dire("ok", "C'est envoyé.",
    "Si un compte existe avec cette adresse, tu vas recevoir un lien pour " +
    "choisir un nouveau mot de passe.");
}

/* Deja connecte ? On ne lui remontre pas la porte d'entree.
   MAIS on ne telecharge pas la bibliotheque pour le decouvrir : Supabase range
   sa session dans le stockage local sous une cle connue. S'il n'y en a pas, il
   n'y a rien a verifier, et la page reste legere pour le visiteur de passage,
   qui est le cas le plus frequent. */
(async () => {
  let trace = false;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      if (/^sb-.*-auth-token$/.test(localStorage.key(i))) { trace = true; break; }
    }
  } catch (e) { /* stockage refuse : on ne verifie pas, la page reste normale */ }
  if (!trace) return;
  try {
    const sb = await supabase();
    const { data } = await sb.auth.getSession();
    if (data && data.session) location.replace(APRES);
  } catch (e) { /* session expiree : page normale */ }
})();
</script>
